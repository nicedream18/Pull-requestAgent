name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uvx ruff check src evals tests
      - name: Unit tests
        run: PYTHONPATH=src uv run pytest tests -q
      - name: Offline benchmark
        run: PYTHONPATH=src uv run python -m evals.run --mode offline --output artifacts/ci
      - name: Offline ablation harness
        run: PYTHONPATH=src uv run python -m evals.ablation --mode offline --output artifacts/ci-ablation
      - name: Path and dedup replay on the committed frozen fixture
        run: |
          PYTHONPATH=src uv run python -m evals.path_ablation --output artifacts/ci-path-ablation
      - name: Candidate dataset label consistency
        run: |
          PYTHONPATH=src uv run python -m evals.check_labels
      - name: Assert the offline baseline did not regress
        run: |
          python - <<'PY'
          import glob, json, sys

          path = sorted(glob.glob("artifacts/ci/*/results.json"))[-1]
          data = json.load(open(path))

          if data.get("evaluator_version") != "prguard-eval-v2":
              sys.exit(f"unexpected evaluator: {data.get('evaluator_version')}")

          dynamic = data["strategies"]["dynamic"]
          print(json.dumps({k: dynamic[k] for k in (
              "tp", "fp", "fn", "defect_precision", "defect_recall", "strict_f1", "advisory_rate"
          )}, indent=2))

          # The dynamic strategy must detect every labelled defect it is allowed to
          # claim. test-gap-07 is intentionally advisory: a diff cannot prove that no
          # test exists, so the verifier refuses to confirm it. That is the only
          # permitted miss, and it must stay an explicit, documented exception.
          if dynamic["fp"] != 0:
              sys.exit("offline dynamic strategy produced false positives on the fixtures")
          if dynamic["tp"] != 9 or dynamic["fn"] != 1:
              sys.exit("offline dynamic recall changed; update the docs before the assertions")
          if dynamic["defect_precision"] < 1.0:
              sys.exit("offline dynamic precision regressed")
          PY

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: PathResolver, dedup and verifier regressions
        run: >
          PYTHONPATH=src uv run pytest
          tests/test_paths_and_dedup.py
          tests/test_path_resolver_multi_file.py
          tests/test_dedup_and_dataset.py
          tests/test_false_positive_controls.py
          tests/test_evaluator_v1_replay.py
          -q
      - name: Production prompt renders without network
        run: |
          PYTHONPATH=src uv run python - <<'PY'
          import re
          from prguard import agents

          for name in agents.AGENTS:
              description = agents.build_task_description(name)
              placeholders = re.findall(r"\{[^{}]*\}", description)
              assert placeholders == ["{review_context}"], (name, placeholders)
              rendered = description.format(review_context="UNTRUSTED")
              assert "UNTRUSTED" in rendered
              assert "Never write 'unknown'" in rendered
          print("all agent prompts render and carry the path contract")
          PY

  replay-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Verify the legacy matcher still reproduces the published v1 numbers
        run: PYTHONPATH=src uv run pytest tests/test_evaluator_v1_replay.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
